name: Apple Store Availability

on:
  schedule:
    - cron: "*/5 * * * *"   # best-effort restarts; GitHub often skips these for hours
  workflow_dispatch:

permissions:
  contents: write             # needed to push last_seen.txt

concurrency:
  group: check
  cancel-in-progress: false

env:
  STORE: R275
  LOCALE: ch-fr
  MODEL: iPhone 18 Pro Max 512GB
  PARTS: MJXT4QL/A=Black,MJXV4QL/A=Burgundy,MJXW4QL/A=Glacier,MJXU4QL/A=Silver
  BUY_URL: https://www.apple.com/ch-fr/shop/buy-iphone/iphone-18-pro
  TZ: Europe/Zurich

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360        # GitHub-hosted job maximum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install needed — stdlib only

      - name: Check availability
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -u iphone_finder.py --ci --repeat 340 --interval 60   # ≈5h45, must end before the timeout

      - name: Commit updated last_seen.txt
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f last_seen.txt 2>/dev/null || exit 0
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git push
