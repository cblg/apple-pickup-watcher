name: Apple Store Availability

on:
  schedule:
    - cron: "*/5 * * * *"   # watchdog only; GitHub often skips these for hours
  workflow_dispatch:
    inputs:
      repeat:
        description: "Checks per run (1/min)"
        default: "340"

permissions:
  contents: write             # needed to push state files
  actions: write              # needed to re-dispatch itself

env:
  MODEL: iPhone 18 Pro Max 512GB
  TZ: Europe/Zurich

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360        # GitHub-hosted job maximum
    concurrency:
      group: check-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ch
            stores: R275            # Rue de Rive, Genève
            locale: ch-fr
            parts: MJXT4QL/A=Black,MJXV4QL/A=Burgundy,MJXW4QL/A=Glacier,MJXU4QL/A=Silver
            buy_url: https://www.apple.com/ch-fr/shop/buy-iphone/iphone-18-pro
          - name: us
            stores: R035,R284       # Michigan Avenue, Lincoln Park (Chicago)
            locale: ""
            parts: MJW84LL/A=Black,MJWA4LL/A=Burgundy,MJWC4LL/A=Glacier,MJW94LL/A=Silver
            buy_url: https://www.apple.com/shop/buy-iphone/iphone-18-pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install needed — stdlib only

      - name: Check availability
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STORES: ${{ matrix.stores }}
          LOCALE: ${{ matrix.locale }}
          PARTS: ${{ matrix.parts }}
          BUY_URL: ${{ matrix.buy_url }}
          STATE_FILE: last_seen_${{ matrix.name }}.txt
        run: python -u iphone_finder.py --ci --repeat ${{ inputs.repeat || 340 }} --interval 60   # 340 ≈ 5h45, must end before the timeout

      - name: Commit updated state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f last_seen_${{ matrix.name }}.txt 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "chore: update ${{ matrix.name }} state [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

  # workflow_dispatch is the one event GITHUB_TOKEN may trigger. Skipped on failure/cancel so a broken
  # check can't loop; the cron watchdog restarts the chain later.
  restart:
    needs: check
    if: needs.check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run check.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
